[project]
site_name = "django-keysmith"
site_description = "Hashed API tokens with lifecycle management for Django"
site_author = "thekodeking"
site_url = "https://thekodeking.github.io/django-keysmith/"
docs_dir = "docs"
repo_name = "thekodeking/django-keysmith"
repo_url = "https://github.com/thekodeking/django-keysmith"
edit_uri = "edit/main/docs"
copyright = "Copyright &copy; 2026 thekodeking"

nav = [
  { Home = "index.md" },
  { "Getting started" = [
    { Install = "getting-started/install.md" },
    { Tutorial = "getting-started/tutorial.md" },
  ] },
  { Topics = [
    { Tokens = "topics/tokens.md" },
    { Authentication = "topics/authentication.md" },
    { Scopes = "topics/scopes.md" },
    { "Audit logs" = "topics/audit.md" },
    { Settings = "topics/settings.md" },
    { Admin = "topics/admin.md" },
  ] },
  { Integrations = [
    { Django = "integrations/django.md" },
    { "Django REST Framework" = "integrations/drf.md" },
  ] },
  { Reference = [
    { Services = "reference/services.md" },
    { Models = "reference/models.md" },
    { Authentication = "reference/authentication.md" },
    { Permissions = "reference/permissions.md" },
    { Commands = "reference/commands.md" },
  ] },
  { Extending = [
    { Customization = "extending/customization.md" },
    { Security = "extending/security.md" },
  ] },
  { Project = [
    { Contributing = "project/contributing.md" },
    { Changelog = "project/changelog.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]
plugins = ["search"]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
]

[project.theme.font]
code = "JetBrains Mono"

[project.theme.icon]
logo = "lucide/key"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[project.extra]
version = { provider = "mike" }

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/thekodeking/django-keysmith"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/django-keysmith/"
